name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "yall/java/**"
      - "vendordep/**"
      - "docs/javadocs/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/test_summary.py"
  pull_request:
    paths:
      - "yall/java/**"
      - "vendordep/**"
      - "docs/javadocs/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/test_summary.py"

# A new push to a pull request cancels that pull request's older runs of this workflow. Pushes to
# main never cancel each other, so every main commit gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Lets the last step commit updated javadocs to main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      # Caches Gradle's downloads between runs, so a run doesn't fetch every dependency from Maven
      # Central and the vendors' servers.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: chmod a+x ./gradlew && ./gradlew build
        working-directory: vendordep
      # docs/javadocs is committed, so check it matches the javadocs the build just made. The
      # scripts, styles and licenses come with the JDK and change between its patch versions, so
      # they aren't compared. On main, the last step commits the new javadocs; on a pull request,
      # this only warns.
      - name: Check docs/javadocs is up to date
        id: javadocs
        run: |
          skip="-x script-files -x resource-files -x legal"
          if diff -r $skip build/maven/javadocs ../docs/javadocs > /dev/null; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            diff -rq $skip build/maven/javadocs ../docs/javadocs || true
            echo "::warning::docs/javadocs is out of date. CI updates it once this is on main, or run ./gradlew updateDocsJavadocs in vendordep and commit docs/javadocs."
          fi
        working-directory: vendordep
      - name: Test
        run: ./gradlew test
        working-directory: vendordep
      - name: Test summary
        if: always()
        run: python3 ../.github/scripts/test_summary.py "YALL unit tests" build/test-results/test
        working-directory: vendordep
      - name: Build and test the example
        run: chmod a+x ./gradlew && ./gradlew build && ./gradlew test
        working-directory: examples/kitbot
      - name: Example test summary
        if: always()
        run: python3 ../../.github/scripts/test_summary.py "Example robot tests" build/test-results/test
        working-directory: examples/kitbot
      # The YAGSL examples, on WPILib 2027.0.0-alpha-7 with the published YAGSL and YAMS vendordeps.
      - name: Build and test the YAGSL Commands v2 example
        run: chmod a+x ./gradlew && ./gradlew build
        working-directory: examples/yagsl-commands2
      - name: YAGSL Commands v2 example test summary
        if: always()
        run: python3 ../../.github/scripts/test_summary.py "YAGSL Commands v2 example tests" build/test-results/test
        working-directory: examples/yagsl-commands2
      - name: Build and test the YAGSL Commands v3 example
        run: chmod a+x ./gradlew && ./gradlew build
        working-directory: examples/yagsl-commands3
      - name: YAGSL Commands v3 example test summary
        if: always()
        run: python3 ../../.github/scripts/test_summary.py "YAGSL Commands v3 example tests" build/test-results/test
        working-directory: examples/yagsl-commands3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            vendordep/build/reports/tests
            examples/kitbot/build/reports/tests
            examples/yagsl-commands2/build/reports/tests
            examples/yagsl-commands3/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: Maven
          path: vendordep/build/allOutputs
      # Runs last, so main only gets new javadocs once everything builds and passes. A push made
      # with the workflow's token doesn't start another run.
      - name: Commit the updated docs/javadocs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.javadocs.outputs.stale == 'true'
        run: |
          ./gradlew updateDocsJavadocs
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/javadocs
          git commit -m "Update docs/javadocs"
          # Another push may have landed on main since this run started.
          git pull --rebase origin main
          git push origin HEAD:main
        working-directory: vendordep
