name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "yall/java/**"
      - "vendordep/**"
      - "example/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "yall/java/**"
      - "vendordep/**"
      - "example/**"
      - ".github/workflows/ci.yml"

# A new push to a pull request cancels that pull request's older runs of this workflow. Pushes to
# main never cancel each other, so every main commit gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod a+x ./gradlew && ./gradlew build
        working-directory: vendordep
      - name: Test
        run: ./gradlew test
        working-directory: vendordep
      - name: Build and test the example
        run: chmod a+x ./gradlew && ./gradlew build && ./gradlew test
        working-directory: example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            vendordep/build/reports/tests
            example/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: Maven
          path: vendordep/build/allOutputs
